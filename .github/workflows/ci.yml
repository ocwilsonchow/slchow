name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint 2>&1 | tee -a ci-output.log

      - name: Format Check
        run: bun run format:check 2>&1 | tee -a ci-output.log

      - name: Type Check
        run: bun run check-types 2>&1 | tee -a ci-output.log

      - name: Build
        run: bun run build 2>&1 | tee -a ci-output.log

      - name: Summarize failure
        if: failure()
        id: failure
        run: |
          python3 << 'PY'
          import os
          import pathlib
          import re

          log_path = pathlib.Path("ci-output.log")
          text = log_path.read_text(errors="replace") if log_path.exists() else ""
          text = re.sub(r"\x1b\[[0-9;]*[mK]", "", text)
          lines = [line.rstrip() for line in text.splitlines() if line.strip()]
          snippet = "\n".join(lines[-50:])
          snippet = snippet.replace("```", "'''")
          max_len = 1800
          if len(snippet) > max_len:
              snippet = "…\n" + snippet[-max_len:]

          if snippet:
              summary = f"```\n{snippet}\n```"
          else:
              summary = "No captured logs. Open the Actions run for details."

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write("summary<<EOF\n")
              handle.write(summary + "\n")
              handle.write("EOF\n")
          PY

      - name: Discord notification
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: CI
          username: GitHub Actions
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          description: ${{ steps.failure.outputs.summary }}
