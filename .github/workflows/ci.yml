name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format Check
        run: bun run format:check

      - name: Type Check
        run: bun run check-types

      - name: Unit tests
        run: bun run --filter web test

      - name: Build
        run: bun run build

      - name: OpenNext build
        run: bun run --filter web build:open-next

      - name: E2E tests
        run: bun run --filter web test:e2e

      - name: Discord notification
        if: always()
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          ack_no_webhook: true
          nofail: true
          status: ${{ job.status }}
          title: CI
          username: GitHub Actions
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          description: ${{ job.status == 'success' && 'All checks passed.' || 'Open the Actions run for details.' }}

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
      url: ${{ github.ref_name == 'main' && 'https://slchow.com' || 'https://dev.slchow.com' }}
    permissions:
      id-token: write
      contents: read
    env:
      SST_STAGE: ${{ github.ref_name == 'main' && 'production' || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c # v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ap-east-1
          role-duration-seconds: 7200

      - name: Deploy
        run: bunx sst deploy --stage "$SST_STAGE"

      - name: Verify production
        if: env.SST_STAGE == 'production'
        run: bun run verify:production

      - name: Discord notification
        if: always()
        uses: sarisia/actions-status-discord@eb045afee445dc055c18d3d90bd0f244fd062708 # v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          ack_no_webhook: true
          nofail: true
          status: ${{ job.status }}
          title: Deploy ${{ env.SST_STAGE }} · ${{ env.SST_STAGE == 'production' && 'slchow.com' || 'dev.slchow.com' }}
          username: GitHub Actions
          url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          description: ${{ job.status == 'success' && 'Deployment checks passed.' || 'Open the Actions run for details.' }}
